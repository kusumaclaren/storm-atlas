name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npm install @capacitor/core@7 @capacitor/android@7
      - run: npm install -D @capacitor/cli@7
      - run: npm run build
      - run: npx cap init "Storm Atlas" io.github.kusumaclaren.stormatlas --web-dir=dist
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: storm-atlas-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
